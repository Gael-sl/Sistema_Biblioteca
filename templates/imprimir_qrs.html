<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Etiquetas QR - Sistema de Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .page-break { page-break-after: always; }
        }
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .label-card {
            width: 4.5cm;
            height: 3cm;
            border: 1px dashed #ccc;
            padding: 5px;
            margin: 5px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
        }
        .qr-img { width: 1.5cm; height: 1.5cm; }
        .book-title { font-size: 8px; font-weight: bold; margin-top: 3px; max-height: 20px; overflow: hidden; line-height: 1; }
        .book-id { font-size: 10px; font-weight: 800; color: #1d1d1f; margin-top: 2px; }
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="no-print mb-4 p-4 bg-white rounded-4 shadow-sm">
        <h2 class="fw-bold">Vista de Impresión de Etiquetas</h2>
        <p class="text-muted">Se han generado etiquetas para {{ libros|length }} ejemplares. Configura tu impresora en "Tamaño real" y "Márgenes mínimos" para mejores resultados.</p>
        <div class="d-flex gap-2">
            <button onclick="window.print()" class="btn btn-dark px-4 py-2 rounded-3">
                <i class="bi bi-printer me-2"></i>Imprimir Ahora
            </button>
            <a href="{{ url_for('inventario') }}" class="btn btn-light px-4 py-2 rounded-3">Volver al Inventario</a>
        </div>
    </div>

    <div class="d-flex flex-wrap justify-content-start">
        {% for libro in libros %}
        <div class="label-card">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data={{ libro.id }}" class="qr-img" alt="QR">
            <div class="book-id">{{ libro.id }}</div>
            <div class="book-title">{{ libro.titulo }}</div>
        </div>
        {% endfor %}
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</body>
</html>

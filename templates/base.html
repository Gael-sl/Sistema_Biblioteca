<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ title or 'Sistema de Biblioteca' }}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23141413'><path d='M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/biblioteca.css') }}?v=design6" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <script>
                    document.addEventListener('DOMContentLoaded', function() {
                        mostrarMensaje({{ message | tojson }}, {{ category | tojson }});
                    });
                </script>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <div class="modal fade" id="glassAlertModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content" style="background: #faf9f5; border-radius: 24px; border: 1px solid #d8d6ce; box-shadow: 0 0 0 1px rgba(20,20,19,0.04), 0 16px 36px rgba(20, 20, 19, 0.10);">
                <div class="modal-body text-center p-4">
                    <div id="glassAlertIcon" class="mb-3 d-flex justify-content-center align-items-center mx-auto" style="width: 56px; height: 56px; border-radius: 50%; background: #e3dacc; color: #141413;">
                        <i class="bi bi-info-circle" id="glassAlertIconInner" style="font-size: 26px; color: #141413;"></i>
                    </div>
                    <h5 id="glassAlertTitle" class="mb-2 fw-bold" style="color: #141413; letter-spacing: -0.02em;">Aviso</h5>
                    <p id="glassAlertMessage" class="mb-4" style="font-size: 14px; color: #6b6a65;">Mensaje de alerta.</p>
                    <div class="d-flex gap-2 justify-content-center" id="glassAlertButtons">
                        <button type="button" id="glassAlertBtnCancel" class="btn btn-light-custom flex-fill d-none py-2" style="border-radius: 9999px; font-weight: 500; color: #141413; background: #e3dacc; border: 1px solid #d8d6ce;" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" id="glassAlertBtnConfirm" class="btn flex-fill py-2 text-white" style="border-radius: 9999px; font-weight: 600; background: linear-gradient(135deg, #d97757 0%, #c6613f 100%); border: none;">Entendido</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=design6"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

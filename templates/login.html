{% extends 'base.html' %}
{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-100" style="background-color: #fafafa;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card-custom p-5 fade-in">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="bi bi-book" style="font-size: 56px; color: #1d1d1f;"></i>
                        </div>
                        <h1 class="mb-2" style="font-size: 28px; color: #1d1d1f; font-weight: 600; letter-spacing: -0.5px;">
                            Sistema de Biblioteca
                        </h1>
                        <p class="text-sm mb-0">Inicia sesión para continuar</p>
                    </div>
                    {% if error %}
                        <div class="alert alert-danger-custom d-flex align-items-center mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <div>{{ error }}</div>
                        </div>
                    {% endif %}
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label-custom">Usuario</label>
                            <input type="text" class="form-control form-control-custom" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label-custom">Contraseña</label>
                            <input type="password" class="form-control form-control-custom" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-dark-custom w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

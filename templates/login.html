{% extends 'base.html' %}
{% block content %}
<style>
    body {
        background-image: none;
    }

    body::before {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
    }

    .login-page {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 16px;
        font-family: var(--font-text);
    }

    /* Fondo de libros conservado */
    .login-page::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2070&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        filter: blur(5px);
        transform: scale(1.05);
        z-index: -2;
    }

    /* Overlay calido y oscuro estilo Fostrelark (elimina el azul antiguo) */
    .login-page::after {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 25%, rgba(20, 20, 19, 0.70) 0%, rgba(14, 14, 13, 0.90) 100%);
        z-index: -1;
    }

    /* Card Fostrelark: Near-black surface, bordes sutiles y esquinas redondeadas */
    .login-card {
        background: rgba(20, 20, 19, 0.88);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(216, 214, 206, 0.14);
        border-radius: 28px;
        padding: 40px 36px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
    }

    /* Brand mark */
    .login-brand-icon {
        width: 58px;
        height: 58px;
        border-radius: 9999px;
        background: #1b1a18;
        border: 1px solid rgba(217, 119, 87, 0.4);
        box-shadow: 0 0 0 4px rgba(217, 119, 87, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px auto;
        color: #d97757;
        font-size: 24px;
    }

    .login-brand-title {
        font-family: var(--font-title);
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #faf9f5;
        margin: 0;
        text-align: center;
    }

    .login-brand-subtitle {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8c8980;
        margin-top: 4px;
        margin-bottom: 24px;
        text-align: center;
    }

    .login-heading {
        text-align: center;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(216, 214, 206, 0.08);
    }

    .login-title {
        color: #faf9f5;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
    }

    .login-subtitle {
        color: #8c8980;
        font-size: 13.5px;
        margin: 0;
        font-weight: 400;
    }

    /* Alerta de error elegante y sutil */
    .login-alert {
        background: rgba(217, 119, 87, 0.12);
        border: 1px solid rgba(217, 119, 87, 0.35);
        color: #fce8e1;
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    /* Formulario e Inputs en pildora */
    .login-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #b0aea5;
        margin-bottom: 6px;
        margin-left: 14px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
    }

    .login-input-wrap {
        position: relative;
        margin-bottom: 18px;
    }

    .login-input-icon {
        position: absolute;
        top: 50%;
        left: 18px;
        transform: translateY(-50%);
        color: #8c8980;
        font-size: 17px;
        pointer-events: none;
        transition: color 0.2s ease;
    }

    .login-pill-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(216, 214, 206, 0.16);
        border-radius: 9999px;
        padding: 13px 46px 13px 48px;
        font-size: 14px;
        font-weight: 500;
        color: #faf9f5;
        transition: all 0.2s ease;
        outline: none;
    }

    .login-pill-input::placeholder {
        color: #6b6a65;
        font-weight: 400;
    }

    .login-pill-input:focus {
        background: rgba(255, 255, 255, 0.07);
        border-color: #d97757;
        box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.22);
        color: #ffffff;
    }

    .login-input-wrap:focus-within .login-input-icon {
        color: #d97757;
    }

    .login-pw-toggle {
        position: absolute;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: #8c8980;
        font-size: 17px;
        padding: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
    }

    .login-pw-toggle:hover {
        color: #faf9f5;
    }

    /* Boton en pildora Fostrelark */
    .login-submit-btn {
        width: 100%;
        background: linear-gradient(135deg, #d97757 0%, #c6613f 100%);
        color: #faf9f5;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        padding: 13px 24px;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 8px 22px rgba(217, 119, 87, 0.32);
        margin-top: 24px;
    }

    .login-submit-btn:hover {
        background: linear-gradient(135deg, #e08364 0%, #cf6947 100%);
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(217, 119, 87, 0.42);
        color: #ffffff;
    }

    .login-submit-btn:active {
        transform: translateY(0);
        box-shadow: 0 4px 12px rgba(217, 119, 87, 0.25);
    }

    .login-submit-btn:disabled {
        opacity: 0.75;
        cursor: not-allowed;
        transform: none;
    }

    /* Banda inferior de seguridad estilo Fostrelark */
    .login-footer-band {
        margin-top: 24px;
        text-align: center;
        font-size: 11.5px;
        color: #737067;
        font-weight: 500;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
</style>

<div class="login-page">
    <div class="login-card fade-in">
        <!-- Brand Mark -->
        <div class="login-brand-icon">
            <i class="bi bi-book-half"></i>
        </div>
        <h1 class="login-brand-title">SISTEMA BIBLIOTECA</h1>
        <p class="login-brand-subtitle">CATÁLOGO &amp; GESTIÓN</p>

        <!-- Heading -->
        <div class="login-heading">
            <h2 class="login-title">Iniciar Sesión</h2>
            <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Alerta de Error -->
        {% if error %}
            <div class="login-alert" role="alert">
                <i class="bi bi-shield-exclamation" style="font-size: 17px; color: #d97757;"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <!-- Formulario -->
        <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="username" class="login-label">Usuario</label>
                <div class="login-input-wrap mb-0">
                    <i class="bi bi-person login-input-icon"></i>
                    <input type="text" class="login-pill-input" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="mb-2">
                <label for="password" class="login-label">Contraseña</label>
                <div class="login-input-wrap mb-0">
                    <i class="bi bi-lock login-input-icon"></i>
                    <input type="password" class="login-pill-input" id="password" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                    <button type="button" class="login-pw-toggle" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-submit-btn" id="loginSubmitBtn">
                <span>Ingresar al Sistema</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <!-- Banda de Seguridad -->
        <div class="login-footer-band">
            <span><i class="bi bi-shield-lock" style="color: #d97757;"></i> Acceso Seguro</span>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('togglePassword');
        const pwInput = document.getElementById('password');
        const pwIcon = document.getElementById('togglePasswordIcon');

        if (toggleBtn && pwInput && pwIcon) {
            toggleBtn.addEventListener('click', function () {
                const isPassword = pwInput.type === 'password';
                pwInput.type = isPassword ? 'text' : 'password';
                pwIcon.classList.toggle('bi-eye-slash', !isPassword);
                pwIcon.classList.toggle('bi-eye', isPassword);
            });
        }

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('loginSubmitBtn');
        if (loginForm && submitBtn) {
            loginForm.addEventListener('submit', function () {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span><span>Verificando...</span>';
            });
        }
    });
</script>
{% endblock %}
